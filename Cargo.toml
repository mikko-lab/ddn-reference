[workspace]
resolver = "2"
members = [
  "apps/validator",
  "policies/negotiation-v1",
  "packages/canonical-json/rust",
  "packages/crypto/rust",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
wasmtime = { version = "27", default-features = false, features = ["runtime", "cranelift"] }
ddn-canonical-json = { path = "packages/canonical-json/rust" }
ddn-crypto = { path = "packages/crypto/rust" }
